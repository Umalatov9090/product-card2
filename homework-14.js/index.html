<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Модальные окна</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="overlay" id="overlay"></div>

	<button class="button" id="registration-button">Регистрация</button>
	<button class="button" id="auth-button">Аутентификация</button>

	<div id="registration-modal" class="modal">
		<button id="registration-close" class="modal-close-button" type="button" aria-label="Закрыть">×</button>
		<h1>Регистрация</h1>
		<span>Пароль</span>
		<span>Повторите пароль</span>
		<span>Логин</span>
		<span>Почта</span>
	</div>

	<div id="auth-modal" class="modal">
		<button id="auth-close" class="modal-close-button" type="button" aria-label="Закрыть">×</button>
		<h1>Аутентификация</h1>
		<p>Логин</p>
		<p>Пароль</p>
	</div>

	<script type="module" src="main.js"></script>
</body>
</html>
