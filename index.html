<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe 24/7</title>
    <link rel="stylesheet" href="cafe.css" />
  </head>
  <body>
    <header class="header">
      <a class="logo" href="#">Cafe 24/7</a>
      <a href="#menu">Меню</a>
    </header>

    <main>
      <section class="hero">
        <p id="cafe-info"></p>
        <h1>Твой любимый напиток —<br />в любое время</h1>
        <a class="button" href="#menu">Посмотреть меню ↓</a>
      </section>

      <section class="content" id="menu">
        <div class="menu">
          <h2>Напитки</h2>
          <div class="filters" aria-label="Категории напитков">
            <button class="active" data-category="all" type="button">Все</button>
            <button data-category="coffee" type="button">Кофе</button>
            <button data-category="tea" type="button">Чай</button>
            <button data-category="lemonade" type="button">Лимонад</button>
          </div>
          <div class="drinks" id="drinks"></div>
        </div>

        <aside class="cart">
          <h2>Ваш заказ <span id="count">0</span></h2>
          <div id="order"></div>
          <p>Итого: <strong id="total">0 ₽</strong></p>
          <button class="button" id="checkout" type="button" disabled>Оформить заказ</button>
          <p id="message" role="status"></p>
        </aside>
      </section>
    </main>

    <footer>Cafe 24/7 · Хороший кофе в любое время</footer>
    <script src="main.js"></script>
  </body>
</html>
